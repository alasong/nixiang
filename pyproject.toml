[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-lab"
version = "0.1.0"
description = "双环沉淀/复用实验台：轨迹沉淀、验证器、查表复用可行性检验"
readme = "README.md"
requires-python = ">=3.10"
# 核心包零第三方依赖，这是有意的：任何机器 clone 下来就能跑 demo
dependencies = []

[project.optional-dependencies]
# 只有 tools/ 下的真实数据分析需要
analysis = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
]

[project.scripts]
harness-lab = "mvp.runner:main"

[tool.setuptools.packages.find]
include = ["mvp*"]
